spring:
  application:
    name: sahastra-backend
  profiles:
    active: dev
  jackson:
    deserialization:
      fail-on-unknown-properties: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sahastra_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 10
          fetch_size: 50
    show-sql: false

  redis:
    host: localhost
    port: 6379
    password: ${REDIS_PASSWORD:}
    timeout: 5000ms
    database: 0
    jedis:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 5
        max-wait: -1ms

  cache:
    type: redis
    redis:
      time-to-live: 600000
      key-prefix: "sd:"

  servlet:
    multipart:
      max-file-size: ${PRODUCT_IMAGE_MAX_SIZE:20MB}
      max-request-size: ${PRODUCT_IMAGE_MAX_REQUEST_SIZE:50MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:kamleshpes@gmail.com}
    password: ${MAIL_PASSWORD:mail_password}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  media:
    product-image-directory: ${PRODUCT_IMAGE_DIRECTORY:./data/product-images}
    product-image-max-size: ${PRODUCT_IMAGE_MAX_SIZE:20MB}
  mail:
    from: ${MAIL_FROM:kamleshpes@gmail.com}
  email-verification:
    base-url: ${EMAIL_VERIFICATION_URL:http://localhost:8080/api/v1/auth/verify-email}
    expiry-hours: ${EMAIL_VERIFICATION_EXPIRY_HOURS:24}

opensearch:
  host: ${OPENSEARCH_HOST:localhost}
  port: ${OPENSEARCH_PORT:9200}
  username: ${OPENSEARCH_USERNAME:admin}
  password: ${OPENSEARCH_PASSWORD:admin}
  ssl:
    enabled: ${OPENSEARCH_SSL_ENABLED:false}

logging:
  level:
    root: INFO
    com.sahastra: DEBUG
    org.springframework.web: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
  file:
    name: logs/application.log
    max-size: 10MB
    max-history: 30

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

---
spring:
  config:
    activate:
      on-profile: prod
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: WARN
    com.sahastra: INFO
  pattern:
    console: "%d{ISO8601} [%thread] %-5level %logger{36} - %msg%n"
